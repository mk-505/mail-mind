<!DOCTYPE html>
<html>

<head>
  <title>Gmail GPT Assistant</title>
  <style>
    body {
      width: 340px;
      padding: 0;
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f7fa;
    }

    .container {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.10);
      margin: 24px;
      padding: 28px 24px 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    h3 {
      margin: 0 0 12px 0;
      font-size: 1.3rem;
      font-weight: 600;
      color: #1a73e8;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    p {
      margin: 0;
      color: #222;
      font-size: 1.05rem;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="container">
    <h3>Gmail GPT Assistant</h3>
    <p>Extension is ready to use! Open Gmail and click the GPT Write button in Gmail to start composing!</p>
  </div>
</body>

</html>
